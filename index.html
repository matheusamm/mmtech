<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Impressões 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Oculta a barra de rolagem do carrossel */
        .carousel-snap::-webkit-scrollbar { display: none; }
        .carousel-snap { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-6 md:p-12">

    <header class="max-w-6xl mx-auto mb-12 text-center">
        <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">Catálogo 3D</h1>
        <p class="text-slate-500 mt-2">Produtos fabricados sob demanda com alta precisão.</p>
    </header>

    <main id="catalogo" class="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- Injeção via JS -->
    </main>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbySmCL1-nTPg-OoHKIlzbyv57MSns9ph3svlaASlEBTaMLoYJf40VJ6Qzr8_vuZoNlR/exec';

        fetch(API_URL)
            .then(response => response.json())
            .then(produtos => {
                const container = document.getElementById('catalogo');
                
                if(produtos.length === 0) {
                    container.innerHTML = '<p class="text-center text-slate-400 col-span-full">Nenhum produto disponível.</p>';
                    return;
                }

                produtos.forEach((p, indexProduto) => {
                    const precoFormatado = typeof p.preco === 'number' 
                        ? p.preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) 
                        : p.preco;

                    // Monta as imagens do carrossel
                    let imagensHtml = '';
                    p.imagens.forEach((imgUrl) => {
                        imagensHtml += `<div class="w-full h-56 flex-shrink-0 bg-slate-100"><img src="${imgUrl}" class="w-full h-full object-cover" loading="lazy"></div>`;
                    });

                    let cardHtml = `
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-md transition-shadow duration-300 flex flex-col">
                            
                            <!-- Container do Carrossel -->
                            <div class="relative group w-full h-56 overflow-hidden">
                                <div id="carousel-${indexProduto}" class="carousel-snap w-full h-full flex overflow-x-auto scroll-smooth snap-x snap-mandatory">
                                    ${imagensHtml}
                                </div>
                                
                                <!-- Botões do Carrossel (Só aparecem se houver mais de 1 imagem) -->
                                ${p.imagens.length > 1 ? `
                                    <button onclick="moverCarrossel(${indexProduto}, -1)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-slate-800 p-1.5 rounded-full shadow-sm opacity-0 group-hover:opacity-100 transition-opacity duration-200">
                                        &#10094;
                                    </button>
                                    <button onclick="moverCarrossel(${indexProduto}, 1)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-slate-800 p-1.5 rounded-full shadow-sm opacity-0 group-hover:opacity-100 transition-opacity duration-200">
                                        &#10095;
                                    </button>
                                ` : ''}
                            </div>

                            <div class="p-6 flex flex-col flex-grow">
                                <h2 class="text-xl font-bold text-slate-900 mb-2">${p.produto.replace(/_/g, ' ')}</h2>
                                <p class="text-slate-500 text-sm flex-grow mb-4">${p.descricao || 'Sem descrição disponível.'}</p>
                                <div class="text-2xl font-black text-emerald-600 mb-4">${precoFormatado}</div>
                                
                                <div class="flex flex-col gap-2 mt-auto">
                    `;

                    if (p.link1) cardHtml += `<a href="${p.link1}" target="_blank" class="w-full text-center bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 px-4 rounded-xl transition-colors text-sm">Plataforma 1</a>`;
                    if (p.link2) cardHtml += `<a href="${p.link2}" target="_blank" class="w-full text-center bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-xl transition-colors text-sm">Plataforma 2</a>`;
                    if (p.link3) cardHtml += `<a href="${p.link3}" target="_blank" class="w-full text-center bg-orange-500 hover:bg-orange-600 text-white font-medium py-2.5 px-4 rounded-xl transition-colors text-sm">Plataforma 3</a>`;

                    cardHtml += `
                                </div>
                            </div>
                        </div>
                    `;

                    container.innerHTML += cardHtml;
                });
            })
            .catch(error => {
                console.error(error);
                document.getElementById('catalogo').innerHTML = '<p class="text-center text-red-500 col-span-full">Erro ao carregar o catálogo.</p>';
            });

        // Função que faz o efeito de rolar para o lado no carrossel
        function moverCarrossel(id, direcao) {
            const carrossel = document.getElementById(`carousel-${id}`);
            const larguraCard = carrossel.offsetWidth;
            carrossel.scrollLeft += (larguraCard * direcao);
        }
    </script>
</body>
</html>
